{% extends "base.html" %}

{% block title %}500 Internal Error | ClickjackShield{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="cyber-card p-5 mx-auto" style="max-width: 540px;">
    <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-3"></i>
    <h2 class="fw-bold text-white mb-2">500 - Internal Server Error</h2>
    <p class="text-muted small mb-4">
      An unexpected server condition occurred while processing the request. Defensive isolation has halted the operation.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-cyber-primary btn-sm">
      <i class="fa-solid fa-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
